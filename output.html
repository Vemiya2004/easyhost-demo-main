<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Portrait | EasyH</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <!-- Load Google Fonts used for city previews and final render -->
  <link href="https://fonts.googleapis.com/css2?display=swap&family=Inter:wght@400;700&family=Playfair+Display:wght@400;700&family=Bebas+Neue&family=Oswald:wght@400;700&family=Montserrat:wght@400;700&family=Pacifico&family=Abril+Fatface&family=Dancing+Script&family=Lobster&family=Righteous&family=Cinzel&family=Raleway:wght@400;700" rel="stylesheet">

  <style>
    /* ============================================
       RESET
    ============================================ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f7f7f5;
      color: #111;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* ============================================
       PAGE STRUCTURE
    ============================================ */
    #page-output {
      min-height: 100vh;
      background: #f7f7f5;
    }

    .output-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 5vw, 48px);
      background: rgba(255, 255, 255, 0.97);
      border-bottom: 1px solid #e5e5e5;
    }

    .btn-link {
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 500;
      color: #888;
      padding: 0;
      transition: color 0.25s ease;
      cursor: pointer;
    }

    .btn-link:hover {
      color: #111;
    }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: #111;
    }

    .output-body {
      display: grid;
      grid-template-columns: 1fr 320px;
      min-height: calc(100vh - 60px);
    }

    @media (max-width: 780px) {
      .output-body {
        grid-template-columns: 1fr;
      }
    }

    .output-canvas-col {
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f7f7f5;
      overflow: auto;
      min-height: calc(100vh - 60px);
    }

    #portrait-wrap {
      position: relative;
      height: calc(100vh - 200px);
      max-height: 600px;
      aspect-ratio: 3/4;
      box-shadow: 0 4px 32px rgba(0, 0, 0, 0.10), 0 1px 6px rgba(0, 0, 0, 0.06);
      background: #0b1929;
      margin: 20px 0;
      flex-shrink: 0;
      overflow: hidden;
    }

    @media (max-width: 780px) {
      #portrait-wrap {
        height: auto;
        width: 85vw;
        max-width: 400px;
        max-height: none;
        margin: 20px auto;
      }
    }

    #output-map-el {
      position: absolute;
      inset: 0;
    }

    #output-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .output-panel {
      padding: clamp(24px, 4vw, 40px) 32px;
      border-left: 1px solid #e5e5e5;
      background: #ffffff;
    }

    @media (max-width: 780px) {
      .output-panel {
        border-left: none;
        border-top: 1px solid #e5e5e5;
      }
    }

    .out-city-name {
      font-size: 28px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }

    .out-country {
      font-size: 15px;
      color: #888;
      margin-bottom: 28px;
    }

    .out-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
    }

    .out-btns .btn {
      width: 100%;
    }

    .out-details {
      border-top: 1px solid #e5e5e5;
      padding-top: 24px;
      margin-bottom: 28px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      padding: 8px 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-key {
      color: #999;
    }

    .detail-val {
      color: #111;
      font-weight: 500;
      text-align: right;
    }

    /* ============================================
       BUTTONS
    ============================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 4px;
      border: none;
      outline: none;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: #111111;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #333;
    }

    .btn-secondary {
      background: #ffffff;
      color: #111;
      border: 1.5px solid #111;
    }

    .btn-secondary:hover {
      background: #111;
      color: #fff;
    }

    .portrait-toolbar {
      margin-top: 14px;
      background: #ffffff;
      border: 1px solid #e5e5e5;
      padding: 14px 16px;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .toolbar-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toolbar-label {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #555;
    }

    .picker-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: #ddd transparent;
    }

    .picker-row::-webkit-scrollbar {
      height: 3px;
    }

    .picker-row::-webkit-scrollbar-track {
      background: transparent;
    }

    .picker-row::-webkit-scrollbar-thumb {
      background: #ddd;
    }

    .font-card {
      flex-shrink: 0;
      width: 140px;
      height: 62px;
      border: 1px solid #ddd;
      background: #fff;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      overflow: hidden;
      transition: border-color 0.12s;
    }

    .font-card:hover {
      border-color: #111;
    }

    .font-card.active {
      border: 2px solid #111;
    }

    .font-card-text {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      color: #111;
    }

    .font-card-name {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      color: #888;
    }

    .style-card {
      flex-shrink: 0;
      width: 120px;
      border: 1px solid #ddd;
      background: #fff;
      padding: 7px 7px 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      overflow: hidden;
      transition: border-color 0.12s;
    }

    .style-card:hover {
      border-color: #111;
    }

    .style-card.active {
      border: 2px solid #111;
    }

    .style-card canvas {
      display: block;
    }

    .style-card-name {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      color: #888;
      white-space: nowrap;
    }

    .maplibregl-ctrl-logo,
    .maplibregl-ctrl-attrib,
    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right,
    .maplibregl-ctrl-top-right {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="page-output">
    <div class="output-header">
      <button class="btn-link" onclick="goBack()">← Back</button>
      <span class="header-title">Your Portrait</span>
      <button class="btn-link" onclick="startOver()">New City →</button>
    </div>
    <div class="output-body">
      <div class="output-canvas-col">
        <div id="portrait-wrap">
          <div id="output-map-el" style="position:absolute; inset: 0;"></div>
          <canvas id="output-canvas" width="900" height="1200"></canvas>
        </div>
        <div class="portrait-toolbar">
          <div class="toolbar-section">
            <span class="toolbar-label">Font</span>
            <div class="picker-row" id="font-picker-row"></div>
          </div>
          <div class="toolbar-section">
            <span class="toolbar-label">Style</span>
            <div class="picker-row" id="style-picker-row"></div>
          </div>
        </div>
      </div>
      <div class="output-panel">
        <div class="out-city-name" id="out-city">—</div>
        <div class="out-country" id="out-country">—</div>

        <div class="out-btns">
          <button class="btn btn-primary" onclick="downloadPortrait()">↓ Download Portrait</button>
          <button class="btn btn-secondary" onclick="sharePortrait()">↗ Share</button>
        </div>

        <div class="out-details">
          <div class="detail-row"><span class="detail-key">City</span><span class="detail-val" id="d-city">—</span></div>
          <div class="detail-row"><span class="detail-key">Country</span><span class="detail-val"
              id="d-country">—</span></div>
          <div class="detail-row"><span class="detail-key">Resolution</span><span class="detail-val">900 × 1200
              px</span></div>
          <div class="detail-row"><span class="detail-key">Style</span><span class="detail-val">Dark Gold Map</span></div>
          <div class="detail-row"><span class="detail-key">Plan</span><span class="detail-val">Free</span></div>
        </div>

        <button class="btn-link" onclick="startOver()">← Create Another</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      city: '',
      country: '',
      lat: 0,
      lon: 0,
      mapZoom: 0,
      pinLngLat: null,
      photoUrl: null,
      removeBackground: true,
      processedPhoto: null,
      outputMapInstance: null,
      cityFont: 'Inter',
      cityTextStyle: 'normal',
    };

    const CITY_FONTS = [
      { value: 'Inter', label: 'Inter' },
      { value: 'Playfair Display', label: 'Playfair Display' },
      { value: 'Bebas Neue', label: 'Bebas Neue' },
      { value: 'Oswald', label: 'Oswald' },
      { value: 'Montserrat', label: 'Montserrat' },
      { value: 'Pacifico', label: 'Pacifico' },
      { value: 'Abril Fatface', label: 'Abril Fatface' },
      { value: 'Dancing Script', label: 'Dancing Script' },
      { value: 'Lobster', label: 'Lobster' },
      { value: 'Righteous', label: 'Righteous' },
      { value: 'Cinzel', label: 'Cinzel' },
      { value: 'Raleway', label: 'Raleway' },
    ];
    const CITY_STYLES = [
      { value: 'normal', label: 'Normal' },
      { value: 'arc-up', label: 'Arc Up' },
      { value: 'arc-down', label: 'Arc Down' },
      { value: 'wave', label: 'Wave' },
      { value: 'size-fade', label: 'Size Fade' },
    ];

    const darkGoldStyle = {
      version: 8,
      sources: {
        openmaptiles: { type: 'vector', url: 'https://tiles.openfreemap.org/planet' }
      },
      layers: [
        { id: 'bg', type: 'background', paint: { 'background-color': '#0b1929' } },
        { id: 'water', type: 'fill', source: 'openmaptiles', 'source-layer': 'water', paint: { 'fill-color': '#081320' } },
        { id: 'landuse', type: 'fill', source: 'openmaptiles', 'source-layer': 'landuse', paint: { 'fill-color': '#0e1f30', 'fill-opacity': 0.9 } },
        { id: 'landcover', type: 'fill', source: 'openmaptiles', 'source-layer': 'landcover', paint: { 'fill-color': '#0c1f18', 'fill-opacity': 0.7 } },
        { id: 'building', type: 'fill', source: 'openmaptiles', 'source-layer': 'building', paint: { 'fill-color': '#122136', 'fill-opacity': 0.95 } },
        { id: 'road-minor', type: 'line', source: 'openmaptiles', 'source-layer': 'transportation', filter: ['in', 'class', 'minor', 'service'], paint: { 'line-color': '#b89050', 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 0.3, 16, 1.5], 'line-opacity': 0.4 } },
        { id: 'road-secondary', type: 'line', source: 'openmaptiles', 'source-layer': 'transportation', filter: ['in', 'class', 'secondary', 'tertiary'], paint: { 'line-color': '#c8a040', 'line-width': ['interpolate', ['linear'], ['zoom'], 8, 0.6, 16, 2.5], 'line-opacity': 0.7 } },
        { id: 'road-primary', type: 'line', source: 'openmaptiles', 'source-layer': 'transportation', filter: ['in', 'class', 'primary', 'trunk'], paint: { 'line-color': '#e0b850', 'line-width': ['interpolate', ['linear'], ['zoom'], 6, 1, 16, 4.5], 'line-opacity': 0.9 } },
        { id: 'road-motorway', type: 'line', source: 'openmaptiles', 'source-layer': 'transportation', filter: ['==', 'class', 'motorway'], paint: { 'line-color': '#f5cc68', 'line-width': ['interpolate', ['linear'], ['zoom'], 5, 1.2, 16, 7], 'line-opacity': 1 } },
      ]
    };

    function goBack() {
      window.location.href = 'photo.html';
    }

    function startOver() {
      sessionStorage.clear();
      window.location.href = 'index.html';
    }

    function initOutputMap() {
      if (!state.pinLngLat || typeof state.pinLngLat.lng !== 'number' || typeof state.pinLngLat.lat !== 'number') return;
      if (state.outputMapInstance) {
        try { state.outputMapInstance.remove(); } catch (e) { }
      }
      document.getElementById('output-map-el').innerHTML = '';

      state.outputMapInstance = new maplibregl.Map({
        container: 'output-map-el',
        style: darkGoldStyle,
        center: [state.pinLngLat.lng, state.pinLngLat.lat],
        zoom: state.mapZoom || 12,
        attributionControl: false,
        preserveDrawingBuffer: true,
      });

      state.outputMapInstance.on('move', () => {
        redrawOutputCanvas();
      });

      state.outputMapInstance.on('load', () => {
        redrawOutputCanvas();
      });
    }

    function redrawOutputCanvas() {
      const canvas = document.getElementById('output-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = 900, H = 1200;

      ctx.clearRect(0, 0, W, H);

      // Vignette
      const vig = ctx.createRadialGradient(W / 2, H * 0.42, H * 0.18, W / 2, H * 0.42, H * 0.82);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(0.65, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.55)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, W, H);

      // Bottom gradient
      const btm = ctx.createLinearGradient(0, H * 0.73, 0, H);
      btm.addColorStop(0, 'rgba(0,0,0,0)');
      btm.addColorStop(0.45, 'rgba(0,0,0,0.72)');
      btm.addColorStop(1, 'rgba(0,0,0,0.95)');
      ctx.fillStyle = btm;
      ctx.fillRect(0, 0, W, H);

      // Top overlay
      const topOvl = ctx.createLinearGradient(0, 0, 0, H * 0.38);
      topOvl.addColorStop(0, 'rgba(0,0,0,0.45)');
      topOvl.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = topOvl;
      ctx.fillRect(0, 0, W, H * 0.38);

      // Photo
      if (state.processedPhoto) {
        const { img, x, y, w, h } = state.processedPhoto;
        ctx.save();
        ctx.shadowColor = !state.removeBackground ? 'rgba(0,0,0,0.6)' : 'rgba(0,0,0,0.55)';
        ctx.shadowBlur = !state.removeBackground ? 48 : 40;
        ctx.shadowOffsetY = !state.removeBackground ? 24 : 20;
        ctx.drawImage(img, x, y, w, h);
        ctx.restore();
      }

      // Pin
      let pinX = W / 2;
      let pinY = H / 2;
      if (state.outputMapInstance && state.pinLngLat) {
        const p = state.outputMapInstance.project([state.pinLngLat.lng, state.pinLngLat.lat]);
        const mapCanvas = state.outputMapInstance.getContainer();
        const rect = mapCanvas.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          pinX = (p.x / rect.width) * W;
          pinY = (p.y / rect.height) * H;
        }
      }

      // If pin overlaps photo, push it outside
      if (state.processedPhoto) {
        const { x: px, y: py, w: photoW, h: photoH } = state.processedPhoto;
        const inside = pinX >= px && pinX <= px + photoW && pinY >= py && pinY <= py + photoH;
        if (inside) {
          const topDist = pinY - py;
          const bottomDist = py + photoH - pinY;
          const leftDist = pinX - px;
          const rightDist = px + photoW - pinX;
          const minDist = Math.min(topDist, bottomDist, leftDist, rightDist);
          const margin = 36;
          if (minDist === topDist) pinY = Math.max(24, py - margin);
          else if (minDist === bottomDist) pinY = Math.min(H - 24, py + photoH + margin);
          else if (minDist === leftDist) pinX = Math.max(24, px - margin);
          else pinX = Math.min(W - 24, px + photoW + margin);
        }
      }

      drawPin(ctx, pinX, pinY, 16);

      // City text
      drawCityText(ctx, state.city, W, H, pinX, pinY);

      // Bottom text
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.60)';
      ctx.font = `400 ${W * 0.028}px 'DM Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(state.country.toUpperCase(), W / 2, H * 0.875);
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.30)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(W / 2 - 60, H * 0.891);
      ctx.lineTo(W / 2 + 60, H * 0.891);
      ctx.stroke();
      ctx.restore();

      // Watermark
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.13)';
      ctx.font = `400 ${W * 0.016}px Inter, sans-serif`;
      ctx.textAlign = 'right';
      ctx.textBaseline = 'bottom';
      ctx.fillText('easyh.space', W - 18, H - 18);
      ctx.restore();
    }

    function drawPin(ctx, cx, cy, r) {
      ctx.save();
      // Pin head — filled circle
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#e63535';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Inner white dot
      ctx.beginPath();
      ctx.arc(cx, cy - r * 0.28, r * 0.32, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fill();

      // Pin tail — teardrop pointing down
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.55, cy + r * 0.65);
      ctx.quadraticCurveTo(cx, cy + r * 2.6, cx, cy + r * 2.6);
      ctx.quadraticCurveTo(cx, cy + r * 2.6, cx + r * 0.55, cy + r * 0.65);
      ctx.fillStyle = '#e63535';
      ctx.fill();

      // Outer glow ring
      ctx.beginPath();
      ctx.arc(cx, cy, r + 6, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(230,53,53,0.30)';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.restore();
    }

    function drawCityText(ctx, text, W, H, pinX, pinY) {
      if (!text) return;
      const font = state.cityFont || 'Inter';
      const style = state.cityTextStyle || 'normal';
      const baseSize = W * 0.088;
      const textY = pinY != null ? Math.min(pinY + baseSize + 20, H - 20) : H * 0.270;
      const textX = pinX != null ? pinX : W / 2;

      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.shadowColor = 'rgba(0,0,0,0.75)';
      ctx.shadowBlur = 20;

      switch (style) {
        case 'arc-up':
          _drawArcText(ctx, text, font, baseSize, W, textX, textY, 'up');
          break;
        case 'arc-down':
          _drawArcText(ctx, text, font, baseSize, W, textX, textY, 'down');
          break;
        case 'wave':
          _drawWaveText(ctx, text, font, baseSize, W, textX, textY);
          break;
        case 'size-fade':
          _drawSizeFadeText(ctx, text, font, baseSize, W, textX, textY);
          break;
        default: // 'normal'
          ctx.font = `700 ${baseSize}px '${font}', sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'alphabetic';
          ctx.fillText(text, textX, textY);
          break;
      }

      ctx.restore();
    }

    function _drawArcText(ctx, text, font, size, W, textX, textY, direction) {
      const r = W * 0.40;
      const chars = [...text];
      ctx.font = `700 ${size}px '${font}', sans-serif`;
      let cx, cy, startA, tbaseline;
      if (direction === 'up') {
        cx = textX; cy = textY + r;
        startA = -Math.PI / 2;
        tbaseline = 'bottom';
      } else {
        cx = textX; cy = textY - r;
        startA = Math.PI / 2;
        tbaseline = 'top';
      }
      ctx.textBaseline = tbaseline;
      const totalW = chars.reduce((s, c) => s + ctx.measureText(c).width, 0);
      const totalAngle = totalW / r;
      let a = startA - totalAngle / 2;

      for (const ch of chars) {
        const cw = ctx.measureText(ch).width;
        a += (cw / 2) / r;
        ctx.save();
        ctx.translate(cx + r * Math.cos(a), cy + r * Math.sin(a));
        ctx.rotate(a + Math.PI / 2);
        ctx.fillText(ch, 0, 0);
        ctx.restore();
        a += (cw / 2) / r;
      }
    }

    function _drawWaveText(ctx, text, font, size, W, textX, baseY) {
      const chars = [...text];
      ctx.font = `700 ${size}px '${font}', sans-serif`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      const widths = chars.map(c => ctx.measureText(c).width);
      const totalW = widths.reduce((s, w) => s + w, 0);
      const amplitude = size * 0.22;
      let x = textX - totalW / 2;

      for (let i = 0; i < chars.length; i++) {
        const wave = Math.sin((i / Math.max(chars.length - 1, 1)) * Math.PI * 2.2) * amplitude;
        ctx.fillText(chars[i], x, baseY + wave);
        x += widths[i];
      }
    }

    function _drawSizeFadeText(ctx, text, font, baseSize, W, textX, baseY) {
      const chars = [...text];
      const n = chars.length;
      const sizes = chars.map((_, i) => {
        const t = n > 1 ? i / (n - 1) : 0.5;
        const s = Math.sin(t * Math.PI);
        return baseSize * (0.52 + s * 0.48);
      });

      const widths = chars.map((ch, i) => {
        ctx.font = `700 ${sizes[i]}px '${font}', sans-serif`;
        return ctx.measureText(ch).width;
      });

      const totalW = widths.reduce((s, w) => s + w, 0);
      let x = textX - totalW / 2;

      for (let i = 0; i < n; i++) {
        ctx.font = `700 ${sizes[i]}px '${font}', sans-serif`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        const yShift = -(sizes[i] - baseSize * 0.52) * 0.28;
        ctx.fillText(chars[i], x, baseY + yShift);
        x += widths[i];
      }
    }

    function updateCityFont(font) {
      state.cityFont = font;
      renderFontPicker();
      renderStylePicker();
      redrawOutputCanvas();
    }

    function updateCityStyle(style) {
      state.cityTextStyle = style;
      renderStylePicker();
      renderFontPicker();
      redrawOutputCanvas();
    }

    function renderFontPicker() {
      const row = document.getElementById('font-picker-row');
      if (!row) return;
      const preview = state.city || 'City';
      row.innerHTML = CITY_FONTS.map(f => `
    <div class="font-card${state.cityFont === f.value ? ' active' : ''}"
         onclick="updateCityFont('${f.value.replace(/'/g, "\\'")}')">
      <div class="font-card-text" style="font-family:'${f.value}',sans-serif">${preview}</div>
      <div class="font-card-name">${f.label}</div>
    </div>
  `).join('');
    }

    function renderStylePicker() {
      const row = document.getElementById('style-picker-row');
      if (!row) return;
      row.innerHTML = '';
      CITY_STYLES.forEach(s => {
        const card = document.createElement('div');
        card.className = 'style-card' + (state.cityTextStyle === s.value ? ' active' : '');
        card.onclick = () => updateCityStyle(s.value);

        const pc = document.createElement('canvas');
        pc.width = 106; pc.height = 44;
        drawStylePreview(pc, s.value);

        const lbl = document.createElement('div');
        lbl.className = 'style-card-name';
        lbl.textContent = s.label;

        card.appendChild(pc);
        card.appendChild(lbl);
        row.appendChild(card);
      });
    }

    function drawStylePreview(cv, styleVal) {
      const ctx = cv.getContext('2d');
      const W = cv.width, H = cv.height;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#0b1929';
      ctx.fillRect(0, 0, W, H);

      const text = state.city || 'City';
      const font = state.cityFont || 'Inter';
      const sz = 15;

      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 2;

      if (styleVal === 'normal') {
        ctx.font = `700 ${sz}px '${font}',sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(text, W / 2, H / 2);
      } else if (styleVal === 'arc-up') {
        const r = W * 0.55, cx = W / 2, cy = H / 2 + r;
        _miniArcText(ctx, text, font, sz, cx, cy, r, 'bottom');
      } else if (styleVal === 'arc-down') {
        const r = W * 0.55, cx = W / 2, cy = H / 2 - r;
        _miniArcText(ctx, text, font, sz, cx, cy, r, 'top');
      } else if (styleVal === 'wave') {
        const chars = [...text];
        ctx.font = `700 ${sz}px '${font}',sans-serif`;
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        const ws = chars.map(c => ctx.measureText(c).width);
        const total = ws.reduce((a, b) => a + b, 0);
        let x = W / 2 - total / 2;
        const amp = 4;
        chars.forEach((ch, i) => {
          const y = H / 2 + Math.sin((i / Math.max(chars.length - 1, 1)) * Math.PI * 2.2) * amp;
          ctx.fillText(ch, x, y); x += ws[i];
        });
      } else if (styleVal === 'size-fade') {
        const chars = [...text];
        const n = chars.length;
        const sizes = chars.map((_, i) => sz * (0.52 + Math.sin((n > 1 ? i / (n - 1) : 0.5) * Math.PI) * 0.48));
        const ws = chars.map((ch, i) => { ctx.font = `700 ${sizes[i]}px '${font}',sans-serif`; return ctx.measureText(ch).width; });
        const total = ws.reduce((a, b) => a + b, 0);
        let x = W / 2 - total / 2;
        chars.forEach((ch, i) => {
          ctx.font = `700 ${sizes[i]}px '${font}',sans-serif`;
          ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
          ctx.fillText(ch, x, H / 2 + 5 - (sizes[i] - sz * 0.52) * 0.25);
          x += ws[i];
        });
      }
    }

    function _miniArcText(ctx, text, font, sz, cx, cy, r, baseline) {
      const chars = [...text];
      ctx.font = `700 ${sz}px '${font}',sans-serif`;
      ctx.textBaseline = baseline;
      const total = chars.reduce((s, c) => s + ctx.measureText(c).width, 0);
      let a = (baseline === 'bottom' ? -1 : 1) * Math.PI / 2 - total / (2 * r);
      chars.forEach(ch => {
        const cw = ctx.measureText(ch).width;
        a += (cw / 2) / r;
        ctx.save();
        ctx.translate(cx + r * Math.cos(a), cy + r * Math.sin(a));
        ctx.rotate(a + Math.PI / 2);
        ctx.fillText(ch, 0, 0);
        ctx.restore();
        a += (cw / 2) / r;
      });
    }

    function downloadPortrait() {
      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = 900;
      finalCanvas.height = 1200;
      const fctx = finalCanvas.getContext('2d');

      if (state.outputMapInstance) {
        state.outputMapInstance.triggerRepaint();
        const mapCanvas = state.outputMapInstance.getCanvas();
        fctx.drawImage(mapCanvas, 0, 0, 900, 1200);
      }

      const overlayCanvas = document.getElementById('output-canvas');
      fctx.drawImage(overlayCanvas, 0, 0, 900, 1200);

      const a = document.createElement('a');
      a.download = `easyh-${state.city.toLowerCase().replace(/\s+/g, '-') || 'portrait'}.png`;
      a.href = finalCanvas.toDataURL('image/png');
      a.click();
    }

    async function sharePortrait() {
      if (navigator.share) {
        try {
          const finalCanvas = document.createElement('canvas');
          finalCanvas.width = 900;
          finalCanvas.height = 1200;
          const fctx = finalCanvas.getContext('2d');

          if (state.outputMapInstance) {
            state.outputMapInstance.triggerRepaint();
            const mapCanvas = state.outputMapInstance.getCanvas();
            fctx.drawImage(mapCanvas, 0, 0, 900, 1200);
          }
          const overlayCanvas = document.getElementById('output-canvas');
          fctx.drawImage(overlayCanvas, 0, 0, 900, 1200);

          const blob = await new Promise(r => finalCanvas.toBlob(r, 'image/png'));
          const name = `easyh-${state.city.toLowerCase().replace(/\s+/g, '-') || 'portrait'}.png`;
          await navigator.share({
            title: `${state.city} Map Portrait`,
            text: `My map portrait of ${state.city} — made with easyh.space`,
            files: [new File([blob], name, { type: 'image/png' })],
          });
          return;
        } catch { }
      }
      downloadPortrait();
    }

    function loadImg(src) {
      return new Promise((resolve, reject) => {
        const i = new Image();
        i.crossOrigin = 'anonymous';
        i.onload = () => resolve(i);
        i.onerror = reject;
        i.src = src;
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      // Load data from sessionStorage
      state.city = sessionStorage.getItem('easyh_city') || '';
      state.country = sessionStorage.getItem('easyh_country') || '';
      state.lat = parseFloat(sessionStorage.getItem('easyh_lat')) || 0;
      state.lon = parseFloat(sessionStorage.getItem('easyh_lon')) || 0;
      state.mapZoom = parseFloat(sessionStorage.getItem('easyh_mapZoom')) || 0;
      state.pinLngLat = JSON.parse(sessionStorage.getItem('easyh_pinLngLat') || 'null');
      state.photoUrl = sessionStorage.getItem('easyh_photoUrl') || null;
      state.removeBackground = sessionStorage.getItem('easyh_removeBackground') === 'true';

      console.log('easyh state:', { city: state.city, pinLngLat: state.pinLngLat, photoUrl: state.photoUrl, mapZoom: state.mapZoom });

      document.getElementById('out-city').textContent = state.city;
      document.getElementById('out-country').textContent = state.country;
      document.getElementById('d-city').textContent = state.city;
      document.getElementById('d-country').textContent = state.country;

      // Populate font/style pickers
      try { renderFontPicker(); renderStylePicker(); } catch (e) { /* ignore */ }

      // Process photo if provided
      if (state.photoUrl) {
        try {
          const img = await loadImg(state.photoUrl);
          const photoH = 1200 * 0.58;
          const photoW = (img.naturalWidth / img.naturalHeight) * photoH;
          const px = (900 - photoW) / 2;
          const py = 1200 - photoH;

          state.processedPhoto = {
            img: img,
            x: px, y: py, w: photoW, h: photoH
          };
        } catch (e) {
          console.error('Photo load failed:', e);
        }
      }

      initOutputMap();
      redrawOutputCanvas();
    });
  </script>
